name: Verify source-grounded workspace
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Reject tracked local environment files
        run: test -z "$(git ls-files '.env*' ':!.env.example')"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
